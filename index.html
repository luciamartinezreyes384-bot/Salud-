<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios Combinados</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ACTIVIDAD 1: ENCUESTA DE SALUD -->
    <h2>Encuesta de Salud</h2>
    <form id="healthForm">
        <label for="edad">Edad *</label>
        <input type="number" id="edad" name="edad" min="1" max="120" required>

        <label for="peso">Peso (kg) *</label>
        <input type="number" id="peso" name="peso" min="1" max="300" step="0.1" required>

        <label for="altura">Altura (cm) *</label>
        <input type="number" id="altura" name="altura" min="50" max="250" required>

        <label for="dolor">Nivel de dolor: <span id="dolorValue">5</span></label>
        <input type="range" id="dolor" name="dolor" min="0" max="10" value="5">

        <label for="sangre">Tipo de sangre *</label>
        <select id="sangre" name="sangre" required>
            <option value="">Selecciona...</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
        </select>

        <button type="submit">Enviar Encuesta</button>
    </form>

    <hr> <!-- Línea separadora -->

    <!-- ACTIVIDAD 2: VALIDACIÓN DE CÓDIGO POSTAL -->
    <h2>Formulario de Dirección</h2>
    <form id="addressForm">
        <label for="cp">Código Postal *</label>
        <input 
            type="text" 
            id="cp" 
            name="cp" 
            pattern="[0-9]{5}" 
            title="Debe ingresar exactamente 5 números" 
            required
            placeholder="Ejemplo: 12345"
        >

        <button type="submit">Validar y Enviar</button>
    </form>

    <script src="script.js"></script>
</body>
</html>
